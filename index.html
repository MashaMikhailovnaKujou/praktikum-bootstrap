<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Modul 3 - Bootstrap</title>
    <!-- Memanggil CSS Bootstrap via CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            margin-top: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 50px;
            padding: 20px 0;
            background-color: #2c3e50;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-sm-10 col-sm-offset-1 form-container">
                <h2 class="page-header" style="margin-top: 0;">Form Registrasi</h2>
                <form action="">
                    <!-- Nama -->
                    <div class="form-group">
                        <label for="name">Nama:</label>
                        <input type="text" class="form-control" placeholder="Name" name="nama" required>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" placeholder="Email" name="email" required>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" class="form-control" placeholder="Password" name="Password" required>
                    </div>

                    <!-- Jenis Kelamin -->
                    <div class="form-group">
                        <label for="jk">Jenis Kelamin:</label>
                        <select class="form-control" id="jk">
                            <option>Pria</option>
                            <option>Wanita</option>
                        </select>
                    </div>

                    <!-- Tombol Submit -->
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Tugas Modul 3 -->
    <footer class="text-center">
        <div class="container">
            <p><strong>Dibuat oleh:</strong> Qatrunada Gyan Ramadhana | <strong>NIM:</strong> 240211060052</p>
        </div>
    </footer>

    <!-- JS Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
